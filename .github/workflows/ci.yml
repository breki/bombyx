name: CI

# Read-only for every job. None of them needs to write, and the
# licence job compiles and runs a freshly installed third-party
# binary -- not somewhere to leave an ambient write token.
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tests run on all three platforms because bombyx builds
  # command lines for `ssh`, `scp` and `tar`, and the quoting and
  # path handling differ per host. A test suite that only ran on
  # Linux would not exercise the workstation this tool is mostly
  # driven from.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and asks for clippy
      # and rustfmt, so rustup fetches the right toolchain and
      # components on first use. Nothing here needs to name them.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `cargo xtask test`, not `cargo test`: CLAUDE.md requires
      # every invocation to go through xtask, so CI runs the same
      # command a developer does and cannot drift from it.
      - name: Test
        run: cargo xtask test

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      # The read-only form. `cargo xtask fmt` rewrites files in
      # place, which in CI would report success on a tree it had
      # just fixed.
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-
      - name: Clippy
        run: cargo xtask clippy

  # The doc gate runs rustdoc twice, once with private items, and
  # neither pass catches what the other does -- see "Doc gate" in
  # CLAUDE.md. It is cheap, and a broken doc link otherwise builds
  # cleanly while the docs quietly stop navigating.
  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-doc-
      - name: Doc
        run: cargo xtask doc

  # The licence, bans and sources gate.
  #
  # In every-push CI, unlike `audit`, because it is **offline**: it
  # reads `Cargo.lock` and the metadata already on disk and reaches
  # no network. An advisory published overnight can fail a pull
  # request that changed nothing; a licence cannot change under you
  # that way, so this belongs on every push and `audit` does not.
  #
  # Pinned and uncached for the same reason `audit` is in the release
  # workflow: this binary *is* the gate.
  deny:
    name: Licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      # **No `~/.cargo` cache in this job.** cargo-deny is the tool
      # the gate consists of, and cargo trusts an already-extracted
      # `registry/src/<crate>` tree with only a `.cargo-ok` marker,
      # re-verifying no checksum -- so compiling it from a restored
      # cache would let a poisoned entry produce a binary that
      # reports `licenses ok` for anything, and `restore-keys` would
      # make a stale default-branch entry reachable from any PR run.
      # Only `target` is cached, which the gate never reads.
      - uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-deny-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-deny-target-

      - name: Install cargo-deny
        run: |
          cargo install --locked --force cargo-deny@0.20.2
          cargo deny --version

      # Its own step, so the download is visibly *not* part of the
      # gate. `--locked` verifies each checksum against Cargo.lock
      # on the way in; the gate then reads only what landed.
      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Licences, bans and sources
        run: cargo xtask deny

      # Here rather than only in the release, because the generator is
      # now a **gate**: a dependency shipping no licence terms fails
      # it. In the release workflow that failure lands after the tag
      # exists, per platform, minutes into the build matrix, and
      # recovery means moving a pushed tag -- which this project has
      # already paid for once, on `v0.3.0`. On every push it costs a
      # few seconds and fails while the dependency is still a diff.
      #
      # `cargo fetch` above put the registry sources on disk, which is
      # where the licence texts are read from. The output is thrown
      # away; only the exit status matters here.
      - name: Third-party attribution generates cleanly
        run: cargo xtask licenses --out "$RUNNER_TEMP/THIRD-PARTY-LICENSES"
