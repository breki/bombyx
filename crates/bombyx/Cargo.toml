[package]
name = "bombyx"
version = "0.2.0"
edition = "2024"
description = "Drive isolated AI-agent VMs on a remote libvirt host over SSH"
license = "MIT"
repository = "https://github.com/breki/bombyx"
# Must live inside the package: `cargo package` does not
# include files above the package root, so pointing at the
# workspace README would publish a dangling reference.
readme = "README.md"
default-run = "bombyx"
keywords = ["cli", "vagrant", "vm", "sandbox", "ssh"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "bombyx"
path = "src/bin/bombyx/main.rs"

[dependencies]
# Library code uses thiserror for typed errors.
# anyhow is for the binary entry point only --
# do NOT use anyhow::Result in lib.rs public API.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# The push archive goes in a private per-run directory, so a
# co-user cannot pre-create the path and a second run cannot
# collide with the first.
tempfile = "3.27"
# PATH lookup. Executability bits, PATHEXT ordering, quoted
# entries and backtracking past unusable candidates are all easy
# to get subtly wrong by hand -- four review findings came from
# exactly that. See `src/tool.rs` for the one policy decision
# bombyx keeps.
which = "8.0"
thiserror = "2"
toml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27"
